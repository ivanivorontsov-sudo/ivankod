name: selftest-and-release
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag to upload the installer to (empty = selftest only)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Ponyatny compiler
        shell: bash
        run: |
          mkdir -p bin && cd bin
          gh release download toolchain -R ${{ github.repository }} --clobber -p 'ponyatny*' -p SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - run: npm run check
      - run: npm test
      - name: Web chat latency on mock sites
        shell: bash
        run: |
          WEBSIM_OUT=websim-result.json npx electron scripts/websim/main.js
          node -e "const r=require('./websim-result.json');let bad=0;for(const[k,v]of Object.entries(r)){console.log(k,JSON.stringify(v.runs.map(x=>({ready:x.ready,sent:x.sent,done:x.done,ok:x.ok}))));if(!v.sameChat||v.userMsgs!==3||v.runs.some(x=>!x.ok||x.sent-x.ready>2000||x.done>20000))bad++}process.exit(bad?1:0)"
      - name: Installer
        shell: bash
        run: npx electron-builder --win nsis --publish never
      - name: Upload to release
        if: ${{ inputs.release != '' }}
        shell: bash
        run: |
          f=$(ls dist/IvanCode-Setup-*.exe | head -1)
          gh release upload "${{ inputs.release }}" "$f" --clobber -R ${{ github.repository }}
